<!-- [xihanzu-NR] -->
<svg xmlns="http://www.w3.org/2000/svg" width="270" height="74" viewBox="0 0 270 74">
  <defs>
    <linearGradient id="bgHs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18110e"/>
      <stop offset="100%" stop-color="#0e0a09"/>
    </linearGradient>
    <linearGradient id="edgeHs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc785c"/>
      <stop offset="50%" stop-color="#e8a55a"/>
      <stop offset="100%" stop-color="#cc785c"/>
    </linearGradient>
    <filter id="glowHs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="266" height="70" rx="10" fill="url(#bgHs)" stroke="url(#edgeHs)" stroke-width="1.2"/>

  <!-- Icon: Rust Gear / Terminal -->
  <g transform="translate(20, 21)" stroke="#cc785c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4 17 10 11 4 5"/>
    <line x1="12" y1="19" x2="20" y2="19"/>
  </g>

  <text x="58" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#faf9f5" letter-spacing="0.5">HYDRASCRIPT</text>
  <text x="58" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">// RUST COMPILER ↗</text>
</svg>
