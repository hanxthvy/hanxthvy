<!-- [xihanzu-NR] -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="connectRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc785c" stop-opacity="0"/>
      <stop offset="25%" stop-color="#cc785c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e8a55a"/>
      <stop offset="75%" stop-color="#cc785c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc785c" stop-opacity="0"/>
    </linearGradient>
    <filter id="connectGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#connectGlow)">
    <text x="450" y="52" text-anchor="middle"
          font-family="'Inter', system-ui, sans-serif"
          font-size="28" font-weight="800" letter-spacing="8" fill="#faf9f5">CONNECT &amp; UPLINK</text>
  </g>

  <text x="450" y="78" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="12" letter-spacing="3" fill="#cc785c">
    // REPO ECOSYSTEM &amp; TRANSMISSION CHANNELS
  </text>

  <line x1="220" y1="92" x2="680" y2="92" stroke="url(#connectRule)" stroke-width="1.5"/>
</svg>
