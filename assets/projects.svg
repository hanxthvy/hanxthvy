<!-- [xihanzu-NR] -->
<svg width="900" height="490" viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Inter:wght@600;700;800&display=swap');
  .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 4px; fill: #faf9f5; }
  .tag { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 1px; fill: #cc785c; }
  .card-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #faf9f5; }
  .card-desc { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 13px; fill: #8e8b82; }
  .metric-lbl { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; fill: #6c6a64; letter-spacing: 0.5px; }
  .metric-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; fill: #e8a55a; }
  .corner { stroke: #cc785c; stroke-width: 1.5; fill: none; opacity: 0.8; }
  .trace { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 50 300; animation: travel 4s linear infinite; }

  @keyframes travel { to { stroke-dashoffset: -400; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>

<radialGradient id="cardBgGrad" cx="50%" cy="10%" r="90%">
  <stop offset="0%" stop-color="#18110e"/>
  <stop offset="50%" stop-color="#110d0b"/>
  <stop offset="100%" stop-color="#090706"/>
</radialGradient>

<linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#cc785c" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#302621" stop-opacity="0.4"/>
</linearGradient>

<filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Outer Container -->
<rect x="0" y="0" width="900" height="490" rx="16" fill="url(#cardBgGrad)"/>
<rect x="2" y="2" width="896" height="486" rx="14" fill="none" stroke="#251b17" stroke-width="1.5"/>

<!-- HUD Corners -->
<path class="corner" d="M20 45 L20 20 L45 20"/>
<path class="corner" d="M880 45 L880 20 L855 20"/>
<path class="corner" d="M20 445 L20 470 L45 470"/>
<path class="corner" d="M880 445 L880 470 L855 470"/>

<!-- Header -->
<text x="40" y="55" class="tag">// CORE ARCHITECTURE</text>
<text x="40" y="85" class="title">FLAGSHIP SYSTEMS &amp; ENGINE</text>
<line x1="40" y1="102" x2="860" y2="102" stroke="#2a1f1b" stroke-width="1"/>

<!-- Panel 1: HydraScript Compiler -->
<g transform="translate(40, 122)">
  <rect x="0" y="0" width="254" height="326" rx="10" fill="#150f0c" stroke="url(#panelBorder)" stroke-width="1.2"/>
  <rect class="trace" x="0" y="0" width="254" height="326" rx="10" stroke="#cc785c"/>

  <rect x="18" y="18" width="60" height="20" rx="4" fill="#261711"/>
  <text x="48" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#cc785c">RUST</text>

  <text x="18" y="70" class="card-title">HydraScript</text>
  <text x="18" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cc785c">Compiler Toolchain</text>

  <text x="18" y="125" class="card-desc">Standalone native Rust compiler</text>
  <text x="18" y="145" class="card-desc">transpiling Pythonic syntax</text>
  <text x="18" y="165" class="card-desc">(.hyx / .hys) to React &amp; Node.js</text>
  <text x="18" y="185" class="card-desc">with zero runtime overhead.</text>

  <line x1="18" y1="215" x2="236" y2="215" stroke="#251c17" stroke-width="1"/>

  <text x="18" y="240" class="metric-lbl">SPEED</text>
  <text x="18" y="260" class="metric-val">~1.4ms / file</text>

  <text x="130" y="240" class="metric-lbl">OVERHEAD</text>
  <text x="130" y="260" class="metric-val">Zero (Native)</text>

  <text x="18" y="292" class="metric-lbl">TARGET</text>
  <text x="18" y="310" class="metric-val">React + ESM</text>
</g>

<!-- Panel 2: HydraScript LLM -->
<g transform="translate(323, 122)">
  <rect x="0" y="0" width="254" height="326" rx="10" fill="#150f0c" stroke="url(#panelBorder)" stroke-width="1.2"/>
  <rect class="trace" x="0" y="0" width="254" height="326" rx="10" stroke="#e8a55a"/>

  <rect x="18" y="18" width="60" height="20" rx="4" fill="#281c10"/>
  <text x="48" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e8a55a">AI / ML</text>

  <text x="18" y="70" class="card-title">HydraScript LLM</text>
  <text x="18" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e8a55a">Fine-Tuned Qwen3</text>

  <text x="18" y="125" class="card-desc">Custom code language model</text>
  <text x="18" y="145" class="card-desc">fine-tuned on 6.9K compiler-</text>
  <text x="18" y="165" class="card-desc">verified training pairs. Edge</text>
  <text x="18" y="185" class="card-desc">CPU inference via llama.cpp.</text>

  <line x1="18" y1="215" x2="236" y2="215" stroke="#251c17" stroke-width="1"/>

  <text x="18" y="240" class="metric-lbl">DATASET</text>
  <text x="18" y="260" class="metric-val">6,965 Samples</text>

  <text x="130" y="240" class="metric-lbl">QUANT</text>
  <text x="130" y="260" class="metric-val">Q8_0 GGUF</text>

  <text x="18" y="292" class="metric-lbl">BASE</text>
  <text x="18" y="310" class="metric-val">Qwen3-0.6B</text>
</g>

<!-- Panel 3: Physical Homelab -->
<g transform="translate(606, 122)">
  <rect x="0" y="0" width="254" height="326" rx="10" fill="#150f0c" stroke="url(#panelBorder)" stroke-width="1.2"/>
  <rect class="trace" x="0" y="0" width="254" height="326" rx="10" stroke="#cc785c"/>

  <rect x="18" y="18" width="70" height="20" rx="4" fill="#261711"/>
  <text x="53" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#cc785c">HARDWARE</text>

  <text x="18" y="70" class="card-title">HPE DL360 Gen9</text>
  <text x="18" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cc785c">1U Homelab Cluster</text>

  <text x="18" y="125" class="card-desc">Physical enterprise server in</text>
  <text x="18" y="145" class="card-desc">room rack running Proxmox VE,</text>
  <text x="18" y="165" class="card-desc">LXC containers, and WireGuard</text>
  <text x="18" y="185" class="card-desc">CGNAT bypass mesh routing.</text>

  <line x1="18" y1="215" x2="236" y2="215" stroke="#251c17" stroke-width="1"/>

  <text x="18" y="240" class="metric-lbl">HYPERVISOR</text>
  <text x="18" y="260" class="metric-val">Proxmox VE</text>

  <text x="130" y="240" class="metric-lbl">TUNNEL</text>
  <text x="130" y="260" class="metric-val">WireGuard</text>

  <text x="18" y="292" class="metric-lbl">DISTRO</text>
  <text x="18" y="310" class="metric-val">Void (runit)</text>
</g>
</svg>
