<!-- [xihanzu-NR] -->
<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .hero-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 58px; letter-spacing: 1px; fill: #ffffff; text-transform: uppercase; }
  .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; fill: #ec48bd; text-transform: uppercase; }
  .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 500; font-size: 15px; fill: #c4c9f5; }
  .pill-green-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 12.5px; letter-spacing: 0.5px; fill: #0a0d3a; }

  @keyframes orb-float-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 20px) scale(1.15); }
  }
  @keyframes orb-float-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -25px) scale(1.2); }
  }
  @keyframes pulse-mesh {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 0.95; }
  }
</style>

<!-- Discord Gradient Mesh -->
<radialGradient id="blurpleOrb" cx="25%" cy="30%" r="65%">
  <stop offset="0%" stop-color="#5865f2" stop-opacity="0.85"/>
  <stop offset="50%" stop-color="#3c45a5" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#0a0d3a" stop-opacity="0"/>
</radialGradient>

<radialGradient id="magentaOrb" cx="80%" cy="40%" r="60%">
  <stop offset="0%" stop-color="#ec48bd" stop-opacity="0.8"/>
  <stop offset="50%" stop-color="#802b78" stop-opacity="0.4"/>
  <stop offset="100%" stop-color="#0a0d3a" stop-opacity="0"/>
</radialGradient>

<linearGradient id="discordBorder" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#5865f2" stop-opacity="0.9"/>
  <stop offset="50%" stop-color="#ec48bd" stop-opacity="0.6"/>
  <stop offset="100%" stop-color="#5865f2" stop-opacity="0.8"/>
</linearGradient>

<filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="16" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Deep Indigo Canvas -->
<rect x="0" y="0" width="900" height="380" rx="36" fill="#0a0d3a"/>

<!-- Mesh Gradient Orbs -->
<g style="animation: pulse-mesh 6s ease-in-out infinite;">
  <circle cx="200" cy="120" r="280" fill="url(#blurpleOrb)" style="animation: orb-float-1 8s ease-in-out infinite;"/>
  <circle cx="720" cy="180" r="260" fill="url(#magentaOrb)" style="animation: orb-float-2 9s ease-in-out infinite;"/>
</g>

<!-- Vignette & Subtle Border -->
<rect x="2" y="2" width="896" height="376" rx="34" fill="none" stroke="url(#discordBorder)" stroke-width="2.5" opacity="0.85"/>

<!-- Content Cluster -->
<g transform="translate(0, 0)">
  <!-- Electric Green High-Intent Pill Badge -->
  <g transform="translate(325, 52)">
    <rect x="0" y="0" width="250" height="32" rx="16" fill="#35ed7e"/>
    <circle cx="18" cy="16" r="4.5" fill="#0a0d3a"/>
    <text x="135" y="21" text-anchor="middle" class="pill-green-text">SYSTEMS &amp; APPLIED AI</text>
  </g>

  <!-- Big Bold Discord All-Caps Headline -->
  <text x="450" y="152" text-anchor="middle" class="hero-title">REYHAN AKHTAR</text>

  <!-- Saturated Magenta Subtitle -->
  <text x="450" y="188" text-anchor="middle" class="hero-sub">COMPILER TOOLCHAIN · EDGE AI · LINUX INFRASTRUCTURE</text>

  <!-- Description Lead -->
  <text x="450" y="226" text-anchor="middle" class="hero-desc">Building native compilers in Rust, fine-tuning local code LLMs,</text>
  <text x="450" y="248" text-anchor="middle" class="hero-desc">and running physical 1U enterprise compute with WireGuard mesh routing.</text>

  <!-- Discord Pill Highlights (Blurple & Magenta) -->
  <g transform="translate(180, 285)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="42" rx="21" fill="#5865f2"/>
    <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13" fill="#ffffff">HYDRASCRIPT</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="180" height="42" rx="21" fill="#ec48bd"/>
    <text x="270" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13" fill="#ffffff">QWEN3-0.6B GGUF</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="165" height="42" rx="21" fill="#1e2353" stroke="#5865f2" stroke-width="1.5"/>
    <text x="457" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13" fill="#00b0f4">HPE DL360 GEN9</text>
  </g>
</g>
</svg>
