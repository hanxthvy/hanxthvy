<!-- [xihanzu-NR] -->
<svg width="900" height="490" viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .disc-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 1px; fill: #ffffff; text-transform: uppercase; }
  .disc-eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #5865f2; text-transform: uppercase; }
  .card-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; letter-spacing: -0.3px; }
  .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 13px; }
  .card-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 400; font-size: 13.5px; fill: #c4c9f5; line-height: 1.5; }
  .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; fill: #8a94d8; text-transform: uppercase; }
  .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 14px; fill: #ffffff; }
</style>

<linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#1e2353"/>
  <stop offset="100%" stop-color="#14183d"/>
</linearGradient>

<linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ec48bd" stop-opacity="0.25"/>
  <stop offset="100%" stop-color="#5865f2" stop-opacity="0.1"/>
</linearGradient>
</defs>

<!-- Deep Indigo Canvas -->
<rect x="0" y="0" width="900" height="490" rx="36" fill="#0a0d3a"/>

<!-- Subtle Inner Glow Border -->
<rect x="2" y="2" width="896" height="486" rx="34" fill="none" stroke="#1e2353" stroke-width="2"/>

<!-- Section Header -->
<text x="44" y="56" class="disc-eyebrow">WHAT I'VE SHIPPED</text>
<text x="44" y="88" class="disc-title">FLAGSHIP SYSTEMS &amp; ARCHITECTURE</text>

<!-- Card 1: HydraScript Compiler (Blurple Accent) -->
<g transform="translate(44, 118)">
  <rect x="0" y="0" width="254" height="330" rx="24" fill="url(#cardGrad1)" stroke="#5865f2" stroke-width="1.8"/>

  <!-- Badge -->
  <rect x="20" y="20" width="70" height="26" rx="13" fill="#5865f2"/>
  <text x="55" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="800" font-size="11" fill="#ffffff">RUST</text>

  <text x="20" y="78" class="card-head">HydraScript</text>
  <text x="20" y="98" class="card-sub" fill="#5865f2">Native Compiler</text>

  <text x="20" y="132" class="card-text">Standalone native Rust compiler</text>
  <text x="20" y="152" class="card-text">transpiling Pythonic syntax</text>
  <text x="20" y="172" class="card-text">(.hyx / .hys) directly to React &amp;</text>
  <text x="20" y="192" class="card-text">Node.js with zero overhead.</text>

  <rect x="20" y="222" width="214" height="1" fill="#2d357a"/>

  <!-- Stats Grid -->
  <text x="20" y="250" class="stat-label">SPEED</text>
  <text x="20" y="270" class="stat-number">~1.4ms / file</text>

  <text x="128" y="250" class="stat-label">OVERHEAD</text>
  <text x="128" y="270" class="stat-number" fill="#35ed7e">Zero (Native)</text>

  <text x="20" y="302" class="stat-label">TARGET</text>
  <text x="20" y="320" class="stat-number">React 18 + ESM</text>
</g>

<!-- Card 2: HydraScript LLM (Vibrant Magenta Accent) -->
<g transform="translate(323, 118)">
  <rect x="0" y="0" width="254" height="330" rx="24" fill="url(#cardGrad1)" stroke="#ec48bd" stroke-width="1.8"/>
  <rect x="0" y="0" width="254" height="330" rx="24" fill="url(#magentaGrad)"/>

  <!-- Badge -->
  <rect x="20" y="20" width="75" height="26" rx="13" fill="#ec48bd"/>
  <text x="57" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="800" font-size="11" fill="#ffffff">AI / ML</text>

  <text x="20" y="78" class="card-head">Hydra LLM</text>
  <text x="20" y="98" class="card-sub" fill="#ec48bd">Qwen3-0.6B LoRA</text>

  <text x="20" y="132" class="card-text">Fine-tuned on 6,965 compiler-</text>
  <text x="20" y="152" class="card-text">verified synthetic pairs. AST</text>
  <text x="20" y="172" class="card-text">validated in continuous loop.</text>
  <text x="20" y="192" class="card-text">Edge CPU via llama.cpp.</text>

  <rect x="20" y="222" width="214" height="1" fill="#2d357a"/>

  <!-- Stats Grid -->
  <text x="20" y="250" class="stat-label">DATASET</text>
  <text x="20" y="270" class="stat-number">6,965 Pairs</text>

  <text x="128" y="250" class="stat-label">QUANT</text>
  <text x="128" y="270" class="stat-number" fill="#35ed7e">Q8_0 GGUF</text>

  <text x="20" y="302" class="stat-label">FRAMEWORK</text>
  <text x="20" y="320" class="stat-number">PyTorch + LoRA</text>
</g>

<!-- Card 3: HPE DL360 Gen9 (Electric Green / Cyan Accent) -->
<g transform="translate(602, 118)">
  <rect x="0" y="0" width="254" height="330" rx="24" fill="url(#cardGrad1)" stroke="#00b0f4" stroke-width="1.8"/>

  <!-- Badge -->
  <rect x="20" y="20" width="95" height="26" rx="13" fill="#00b0f4"/>
  <text x="67" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="800" font-size="11" fill="#0a0d3a">HOMELAB</text>

  <text x="20" y="78" class="card-head">DL360 Gen9</text>
  <text x="20" y="98" class="card-sub" fill="#00b0f4">1U Rack Cluster</text>

  <text x="20" y="132" class="card-text">Enterprise server in room rack</text>
  <text x="20" y="152" class="card-text">orchestrating Proxmox VE,</text>
  <text x="20" y="172" class="card-text">WireGuard CGNAT mesh bypass,</text>
  <text x="20" y="192" class="card-text">and Pterodactyl container nodes.</text>

  <rect x="20" y="222" width="214" height="1" fill="#2d357a"/>

  <!-- Stats Grid -->
  <text x="20" y="250" class="stat-label">HYPERVISOR</text>
  <text x="20" y="270" class="stat-number">Proxmox VE</text>

  <text x="128" y="250" class="stat-label">NETWORK</text>
  <text x="128" y="270" class="stat-number" fill="#35ed7e">WireGuard</text>

  <text x="20" y="302" class="stat-label">DAILY OS</text>
  <text x="20" y="320" class="stat-number">Void (runit)</text>
</g>
</svg>
