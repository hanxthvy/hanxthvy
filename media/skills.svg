<!-- [xihanzu-NR] -->
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .disc-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 1px; fill: #ffffff; text-transform: uppercase; }
  .disc-eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #ec48bd; text-transform: uppercase; }
  .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1.5px; fill: #5865f2; text-transform: uppercase; }
  .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
  .pill-green-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 13px; fill: #0a0d3a; }
</style>
</defs>

<!-- Deep Indigo Canvas -->
<rect x="0" y="0" width="900" height="420" rx="36" fill="#0a0d3a"/>
<rect x="2" y="2" width="896" height="416" rx="34" fill="none" stroke="#1e2353" stroke-width="2"/>

<!-- Header -->
<text x="44" y="56" class="disc-eyebrow">STACK &amp; CAPABILITIES</text>
<text x="44" y="88" class="disc-title">ENGINEERING TOOLBOX</text>

<!-- Row 1: Systems & Core -->
<g transform="translate(44, 120)">
